[pytest]
# NO addopts here, deliberately.
#
# The pipeline's coverage stage already runs
#     python -m pytest --cov --cov-report=xml:/src/coverage.xml
# and points Sonar at that exact path. Adding `--cov-report=xml:coverage.xml`
# here appended a SECOND xml report with a different destination, which is how a
# report gets written somewhere Sonar never looks. Coverage belongs to whoever
# invokes pytest; this file's job is only to say WHAT to collect.

# Test the service, not the code it generates — the same split ruff.toml makes.
#
# Bare `pytest` from the repo root collected 213 test files out of
# generated_connectors/ (per-tenant connector code the Integration Builder
# emits) plus the vendored virtualenvs under core/. It failed with 210
# collection errors, all ModuleNotFoundError: those tests import each
# connector's own dependencies, which are installed on demand into the runtime,
# not into this repo's environment. They are not runnable here and never were.
#
# Naming the real test roots is what makes `pytest` mean something. A generated
# connector's tests DO run — in the connector build (tools/build_artifact.py in
# public-connectors), against its own installed dependencies, which is the only
# place they can pass.
testpaths =
    core/tests
    core/services

norecursedirs =
    .venv
    .connector-venv
    generated_connectors
    plan_cache
    logs
    *.egg-info
