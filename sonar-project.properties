# Sonar sees the service, not the code it generates — the same boundary
# ruff.toml, pytest.ini and .trivyignore draw.
#
# generated_connectors/ is per-tenant connector code the Integration Builder
# EMITS at runtime: 3,466 tracked files for one tenant. Measuring coverage or
# counting violations against it says nothing about this service, and it is why
# the other three gates had to be scoped before they meant anything.
sonar.projectKey=shielva-connectors
sonar.sources=core
sonar.tests=core/tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=generated_connectors/**,logs/**,plan_cache/**,**/.venv/**,**/.connector-venv/**
sonar.coverage.exclusions=core/tests/**,**/__init__.py
