# Sonar sees the service, not the code it generates.
#
# NO projectKey here on purpose. The pipeline derives it per service
# (owner_repo, plus the subdir for a monorepo) and passes it as -D. Setting one
# in this file risks the scan uploading to a DIFFERENT project than the quality
# gate then reads — which surfaces as new_coverage 0.0 with no other symptom.
# Project identity belongs to the pipeline; this file only scopes what is
# analysed.
#
# Coverage paths are likewise the pipeline's: its coverage stage runs pytest and
# passes -Dsonar.python.coverage.reportPaths itself.
#
# generated_connectors/ is per-tenant connector code the Integration Builder
# EMITS at runtime — 3,466 tracked files for one tenant. Measuring coverage or
# counting violations against emitted output says nothing about this service,
# and scoping it out is the same boundary ruff.toml, pytest.ini and .trivyignore
# each had to draw.
sonar.exclusions=generated_connectors/**,logs/**,plan_cache/**,**/.venv/**,**/.connector-venv/**
sonar.coverage.exclusions=core/tests/**,**/__init__.py
